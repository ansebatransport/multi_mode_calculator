[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multi-mode-calculator"
version = "1.0.0"
description = "Professional multi-mode calculator with Standard, Scientific, Programmer, Graph, Unit Converter, and Financial modes"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Calculator Project" },
]
keywords = ["calculator", "scientific", "graphing", "financial", "programmer"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "flet>=0.86.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
build = [
    "hatchling",
]

[project.scripts]
calculator = "main:main"

[project.urls]
Homepage = "https://github.com/calculator-project/multi-mode-calculator"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.hatch.build.targets.wheel]
packages = ["core", "ui", "utils", "platforms", "modes"]
